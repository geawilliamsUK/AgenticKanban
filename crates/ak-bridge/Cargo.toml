[package]
name = "ak-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ak-core = { version = "0.1.0", path = "../ak-core" }
ak-runtime = { version = "0.1.0", path = "../ak-runtime" }
ak-store = { version = "0.1.0", path = "../ak-store" }
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tower = "0.5.3"
