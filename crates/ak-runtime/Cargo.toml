[package]
name = "ak-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ak-core = { version = "0.1.0", path = "../ak-core" }
ak-store = { version = "0.1.0", path = "../ak-store" }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
fd-lock = "4.0.4"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "macros", "fs", "process", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
