[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
ak-core = { path = "crates/ak-core" }
ak-store = { path = "crates/ak-store" }
ak-runtime = { path = "crates/ak-runtime" }

[profile.dev]
# Keep incremental builds fast; egui and sqlx are heavy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
